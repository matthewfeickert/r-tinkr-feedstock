schema_version: 1

context:
  version: "0.3.1"

package:
  name: r-tinkr
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/tinkr_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/tinkr/tinkr_${{ version }}.tar.gz
  sha256: 425bc04af76483b8cf713ad141bdebb963cf54dd363fbdbee3a709820ec4d23e

build:
  number: 1
  noarch: generic
  script: ${{ R }} CMD INSTALL --build .

requirements:
  host:
    - r-base
    - r-r6
    - r-commonmark >=1.6
    - r-glue
    - r-lifecycle
    - r-magrittr
    - r-purrr
    - r-rlang >=0.4.5
    - r-xml2
    - r-xslt
  run:
    - r-base
    - r-r6
    - r-commonmark >=1.6
    - r-glue
    - r-lifecycle
    - r-magrittr
    - r-purrr
    - r-rlang >=0.4.5
    - r-xml2
    - r-xslt

tests:
  - r:
      libraries:
        - tinkr
  - files:
      source:
        - tests/
    requirements:
      run:
        - r-testthat
    script:
      - Rscript -e "testthat::test_file('tests/testthat.R', stop_on_failure=TRUE)"

about:
  license: GPL-3.0-or-later
  summary: Cast '(R)Markdown' Files to 'XML' and Back Again
  description: |-
    Parsing '(R)Markdown' files with numerous regular expressions can be
    fraught with peril, but it does not have to be this way.
    Converting '(R)Markdown' files to 'XML' using the 'commonmark' package
    allows in-memory editing via of 'markdown' elements via 'XPath' through
    the extensible 'R6' class called 'yarn'.
    These modified 'XML' representations can be written to '(R)Markdown'
    documents via an 'xslt' stylesheet which implements an extended version of
    'GitHub'-flavoured 'markdown' so that you can tinker to your hearts content.
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  homepage: https://docs.ropensci.org/tinkr/
  repository: https://github.com/ropensci/tinkr
  documentation: https://docs.ropensci.org/tinkr/

extra:
  recipe-maintainers:
    - conda-forge/r
    - matthewfeickert
